name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    name: Deploy API
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - run: bun install

      - name: Build shared package
        run: bun run build
        working-directory: packages/shared

      # マイグレーションはデプロイの「前」に流す。
      #
      # 逆順にすると、新しいテーブルを前提にしたコードが先に本番へ出て、
      # 適用が終わるまでの間そのエンドポイントが 500 を返す。
      # 先に適用しておけば、失敗したときもデプロイまで到達せず旧コードが生き残る。
      #
      # `--remote` が無いとローカルの .wrangler ディレクトリに当ててしまい、
      # 本番の D1 は一切変わらないまま成功扱いになる。
      #
      # 適用済みのマイグレーションは D1 側の `d1_migrations` テーブルで
      # 管理されるため、毎回の push で流しても二重適用にはならない。
      - name: Apply D1 migrations
        run: bun wrangler d1 migrations apply world-issue-tracker --remote
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API to Cloudflare Workers
        run: bun wrangler deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    runs-on: ubuntu-latest
    name: Deploy Web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - run: bun install

      - name: Build shared package
        run: bun run build
        working-directory: packages/shared

      - name: Build and deploy Web to Cloudflare Pages
        run: bun run deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # NEXT_PUBLIC_* はビルド時にバンドルへ埋め込まれるため、ここで渡さないと
          # 本番の Web が localhost:8787 を見に行って一覧が空になる。
          # 秘密ではないので secrets ではなく直接書いている
          NEXT_PUBLIC_API_URL: https://world-issue-tracker-api.mktoho.workers.dev
