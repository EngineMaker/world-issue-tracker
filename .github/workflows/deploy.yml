name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    name: Deploy API
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - run: bun install

      - name: Build shared package
        run: bun run build
        working-directory: packages/shared

      # デプロイの「前」にマイグレーションを当てる。
      #
      # 順序が逆だと、新しいテーブルを参照する新コードが先に本番へ出て、
      # マイグレーションが当たるまでの間そのエンドポイントが 500 を返す
      # （テーブルが無いので D1 が例外を投げ、app.onError が 500 に正規化する）。
      # 先に当てておけば、失敗してもデプロイまで到達せず旧コードが生き残る。
      #
      # `--remote` が無いとローカルの .wrangler ディレクトリに当ててしまい、
      # 本番の D1 は一切変わらないまま成功扱いになる。
      #
      # 適用済みのマイグレーションは D1 の `d1_migrations` テーブルで管理されるため、
      # push のたびに実行しても二重適用にはならない。
      - name: Apply D1 migrations
        run: bun wrangler d1 migrations apply world-issue-tracker --remote
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API to Cloudflare Workers
        run: bun wrangler deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    runs-on: ubuntu-latest
    name: Deploy Web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - run: bun install

      - name: Build shared package
        run: bun run build
        working-directory: packages/shared

      - name: Build and deploy Web to Cloudflare Pages
        run: bun run deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # NEXT_PUBLIC_* はビルド時にバンドルへ埋め込まれるため、ここで渡さないと
          # 本番の Web が localhost:8787 を見に行って一覧が空になる。
          # 秘密ではないので secrets ではなく直接書いている
          NEXT_PUBLIC_API_URL: https://world-issue-tracker-api.mktoho.workers.dev
          # 地図タイルの配信元（#63）。空なので詳細ページは地図を出さず、
          # 座標の数値だけを表示する。本番用の配信元がまだ無いため空にしている
          # （OpenStreetMap の公開タイルサーバーは本番での直接利用が
          # 利用規約で制限されている）。配信元が決まったら、ここと
          # apps/web/wrangler.jsonc の両方に入れる
          NEXT_PUBLIC_MAP_TILE_URL: ""
          NEXT_PUBLIC_MAP_TILE_ATTRIBUTION: ""
