[test]
# `next/headers` のモックを全テストより先に読み込む。
#
# `mock.module` はプロセス全体に効くが、**そのモジュールを import した
# ファイルが実行されて初めて登録される**。テスト対象が
# `next/headers` を読むより後に登録されると間に合わない。
#
# 各テストファイルが個別に import する形にしていると、
# 「たまたま先に走ったファイルが登録してくれたから通る」状態になり、
# 実行順が変わると落ちる。実際に CI で
# `Export named 'headers' not found in module 'next/headers'` が出た
# （手元では別ファイルが先に走って登録されていたため再現しなかった）。
#
# preload なら順序に関係なく必ず先に登録されるので、
# どのファイルを単体で実行しても、全体で実行しても同じ結果になる。
#
# `next/navigation` のモックも同じ理由で preload に置く（Issue #118）。
# `IssuesMap` は MapLibre で動かした地図の位置を URL へ反映するのに
# `useRouter` を呼ぶが、実物はルーターコンテキストが無いと
# `invariant expected app router to be mounted` で落ちる。
# 個別に import する形にすると、また実行順で結果が変わる状態に戻る。
preload = ["./test/helpers/mock-cookies.ts", "./test/helpers/mock-navigation.ts"]
